name: aula-virtual-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-portal-env: &portal-env
  env_file:
    - ${PORTAL_ENV_FILE:-/opt/aula-virtual/.env.portal}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: warning
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    API_SERVICIOS_BASE_URL: http://api-nginx

x-api-env: &api-env
  env_file:
    - ${API_ENV_FILE:-/opt/aula-virtual/.env.api}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: warning
    CACHE_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  portal:
    build:
      context: /opt/aula-virtual/aula-virtual
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    <<: *portal-env
    depends_on:
      redis:
        condition: service_healthy
      api-nginx:
        condition: service_started
    volumes:
      - portal-storage:/var/www/storage
      - portal-bootstrap-cache:/var/www/bootstrap/cache
      - ${AULA_SECRETS_DIR:-/opt/aula-virtual/secrets}:/run/secrets/aula:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"pdo_mysql\") && extension_loaded(\"redis\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  portal-nginx:
    build:
      context: /opt/aula-virtual/aula-virtual
      dockerfile: Dockerfile.nginx.prod
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${PORTAL_HTTP_PORT:-8010}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  api:
    build:
      context: /opt/aula-virtual/aula-virtual-api-servicios
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    <<: *api-env
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-storage:/var/www/storage
      - api-bootstrap-cache:/var/www/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"pdo_mysql\") && extension_loaded(\"redis\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  api-nginx:
    build:
      context: /opt/aula-virtual/aula-virtual-api-servicios
      dockerfile: docker/nginx/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  portal-worker:
    build:
      context: /opt/aula-virtual/aula-virtual
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    <<: *portal-env
    depends_on:
      redis:
        condition: service_healthy
      api-nginx:
        condition: service_started
    volumes:
      - portal-storage:/var/www/storage
      - portal-bootstrap-cache:/var/www/bootstrap/cache
      - ${AULA_SECRETS_DIR:-/opt/aula-virtual/secrets}:/run/secrets/aula:ro
    command: php artisan queue:work redis --sleep=1 --tries=1 --timeout=120
    logging: *default-logging

  portal-scheduler:
    build:
      context: /opt/aula-virtual/aula-virtual
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    <<: *portal-env
    depends_on:
      redis:
        condition: service_healthy
      api-nginx:
        condition: service_started
    volumes:
      - portal-storage:/var/www/storage
      - portal-bootstrap-cache:/var/www/bootstrap/cache
      - ${AULA_SECRETS_DIR:-/opt/aula-virtual/secrets}:/run/secrets/aula:ro
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    logging: *default-logging

  api-worker:
    build:
      context: /opt/aula-virtual/aula-virtual-api-servicios
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    <<: *api-env
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-storage:/var/www/storage
      - api-bootstrap-cache:/var/www/bootstrap/cache
    command: php artisan queue:work redis --sleep=1 --tries=1 --timeout=120
    logging: *default-logging

  api-scheduler:
    build:
      context: /opt/aula-virtual/aula-virtual-api-servicios
      dockerfile: docker/php/Dockerfile.prod
    restart: unless-stopped
    <<: *api-env
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-storage:/var/www/storage
      - api-bootstrap-cache:/var/www/bootstrap/cache
    command: sh -lc "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    logging: *default-logging

volumes:
  redis-data:
  portal-storage:
  portal-bootstrap-cache:
  api-storage:
  api-bootstrap-cache:
